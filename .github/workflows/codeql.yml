name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt secrets
        run: ./.github/scripts/decrypt_secret.sh
        env:
          SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
      - name: Build
        run: xcodebuild -scheme "TripKit macOS" -destination "generic/platform=macOS" build CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
